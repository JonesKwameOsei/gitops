apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gh-app-test-dev
  namespace: argocd             # Applications always live in Argo CD's namespace
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/joneskwameosei-org/gh-app-test.git
    targetRevision: main
    path: charts/gh-app-test
    helm:
      releaseName: gh-app-test
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gh-app-test-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        gateway-access: "true"
