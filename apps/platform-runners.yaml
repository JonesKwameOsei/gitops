apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-runners
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joneskwameosei-org/gitops.git
    targetRevision: main
    path: platform/runners
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
