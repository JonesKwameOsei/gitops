apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "backstage.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 7007
      targetPort: http
