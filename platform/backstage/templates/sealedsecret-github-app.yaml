{{- with .Values.github.sealedSecret }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $.Values.github.appSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "backstage.labels" $ | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: {{ $.Values.github.appSecret }}
      namespace: {{ $.Release.Namespace }}
{{- end }}
