redis-ha:
  enabled: false

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

global:
  domain: argocd.test.com

configs:
  cm:
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
  params:
    server.insecure: true

server:
  replicas: 1

  httproute:
    enabled: true
    hostnames:
      - argocd.test.com
    parentRefs:
      - name: web
        namespace: default
        sectionName: https

  grpcroute:
    enabled: false
